name: Stimmen erzeugen

# Spricht alle festen Sätze der App einmal mit ElevenLabs und legt sie als MP3 in die App.
# Läuft von selbst, wenn sich Sprüche ändern, und lässt sich unter "Actions" auch von Hand starten.
# Braucht das Repository-Secret ELEVENLABS_API_KEY; ohne Secret passiert nichts.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/de/putzalarm/app/ui/screens/**'
      - 'tools/make_voices.py'
      - 'tools/voices.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: stimmen
  cancel-in-progress: false

jobs:
  stimmen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sätze mit ElevenLabs sprechen
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then echo "Kein ELEVENLABS_API_KEY eingetragen, nichts zu tun."; exit 0; fi
          python3 tools/make_voices.py
      - name: Aufnahmen einchecken und App neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A app/src/main/assets/stimme
          if git diff --cached --quiet; then echo "Keine neuen Aufnahmen."; exit 0; fi
          git config user.name "putzalarm-stimmen"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stimmen: neue Aufnahmen von ElevenLabs"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          gh workflow run "APK bauen" --ref main
