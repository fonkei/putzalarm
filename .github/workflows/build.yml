name: APK bauen

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Festen Schlüssel bereitstellen (nur auf main)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.PUTZALARM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/putzalarm.jks"
            echo "PUTZALARM_KEYSTORE=$RUNNER_TEMP/putzalarm.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret PUTZALARM_KEYSTORE_BASE64 fehlt, es wird kein Release veröffentlicht."
          fi
      - name: Debug-APK bauen
        env:
          PUTZALARM_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: putzalarm-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Als Release veröffentlichen (direkter Download fürs Tablet)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PUTZALARM_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk putzalarm.apk
          gh release create "build-${{ github.run_number }}" putzalarm.apk \
            --title "Putzalarm Build ${{ github.run_number }}" \
            --notes "Automatisch gebaut aus ${{ github.sha }}. Auf dem Tablet putzalarm.apk antippen und installieren." \
            --latest
